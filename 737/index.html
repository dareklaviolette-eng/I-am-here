<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I'M HERE · 737-800 Flight Deck</title>
<style>

  .lbl:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; }

  button.on { background: #1f5b4b; border-color: #6cdbb4; }

  #readout b { color: #fff; }
  .src { color: #7d93a3; font-size: 10px; margin-top: 8px; line-height: 1.4; }
  #loader { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; padding: 18px 22px;
    border-radius: 12px; background: #07131ee8; border: 1px solid var(--line); min-width: 240px; }

<div id="view"></div>
<header><div id="brand">737-800 <small>flight deck</small></div></header>

<aside id="panel">
  <div class="lbl">Seat</div>
  <div class="row" id="seats">
    <button data-seat="captain" class="on">Captain</button>
    <button data-seat="fo">First Officer</button>
    <button data-seat="jump">Jumpseat</button>
    <button data-seat="overhead">Overhead</button>
    <button data-seat="outside" title="Follow camera behind the aircraft; drag to orbit, it eases back">Chase</button>
  </div>
  <div class="lbl">Time of day</div>
  <div class="row" id="tod">
    <button data-tod="day" class="on">Day</button><button data-tod="dusk">Dusk</button><button data-tod="night">Night</button>
  </div>
  <div class="lbl">Airport</div>
  <div class="row"><input id="apt" value="KBNA" maxlength="8" spellcheck="false" autocomplete="off" aria-label="Airport code (ICAO, e.g. KJFK, EGLL)"><button id="aptGo">Go</button></div>
  <div class="row" style="margin-top:5px"><select id="rwy" aria-label="Runway"></select></div>
  <div class="src" id="aptStatus">Loading airport…</div>
  <div class="lbl">Flight</div>
  <div class="row" id="modes"><button data-mode="approach" class="on" id="landBtn">Land BNA 2L</button><button data-mode="cruise">Cruise</button></div>
  <div class="row" style="margin-top:5px"><button id="play" class="on">Pause</button><button id="restart">Restart</button></div>
  <div class="lbl">Weather</div>
  <div class="row"><button data-wx="live" class="on">Live (METAR)</button><button data-wx="clear">Clear</button></div>
  <div class="src" id="wxNote"></div>
  <div class="lbl">Join a real flight</div>
  <div class="row"><button id="liveFind">Live flights nearby</button><button id="liveLeave" hidden>Leave flight</button></div>
  <div class="row" style="margin-top:5px"><input id="liveQ" placeholder="Flight or tail (SWA1234, N8501V)" spellcheck="false" autocomplete="off" aria-label="Search a live flight by flight number or tail"><button id="liveGo">Find</button></div>
  <div id="liveList"></div>
  <div class="src" id="liveStatus">Live ADS-B within 150 nm of the airport. 737s first.</div>
  <div class="lbl">Scenery</div>
  <div class="row"><button id="scenery">Real scenery (Google 3D)</button></div>
  <div class="src" id="sceneryNote"></div>
  <div id="realRow" class="off" title="Blend of Google 3D tiles over our airport render (test control)">
    <span>Realism (test)</span><input id="realism" type="range" min="0" max="100" step="5" value="70" aria-label="Realism: Google 3D tiles opacity" disabled>
    <span id="realVal">70%</span><label><input id="realAuto" type="checkbox" checked> Auto</label>
  </div>
  <div class="src" id="realNote"></div>
  <div class="lbl">Now</div>
  <div id="readout">—</div>
</aside>
<button id="toggle">☰</button>

<div id="loader">Loading 737-800 flight deck<div id="bar"><div></div></div></div>
<div id="credit">Cockpit model: <a href="https://sketchfab.com/3d-models/boeing-737-800-cockpit-d463256f98654b36af019d2d88bd5bbe" target="_blank" rel="noopener">"Boeing 737-800 Cockpit"</a> by hakai315 · CC BY 4.0 · optimized</div>
<div id="gcredit" hidden><img id="glogo" alt="Google" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_light_color_272x92dp.png"><span id="gattr"></span></div>

setInterval(() => { if (!renderer.xr.isPresenting) return; let b = null; for (const ct of vrCtrls) { const p = ctrlRay(ct); if (p) b = efb.btnAt(p) || b; } efb.hover = b; }, 100);

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
document.querySelectorAll('[data-seat]').forEach((b) => (b.onclick = () => setSeat(b.dataset.seat)));
document.querySelectorAll('[data-tod]').forEach((b) => (b.onclick = () => setTOD(b.dataset.tod)));
$('play').onclick = () => { paused = !paused; $('play').textContent = paused ? 'Play' : 'Pause'; $('play').classList.toggle('on', !paused); };
$('restart').onclick = () => setMode(mode);
document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
$('toggle').onclick = () => $('panel').classList.toggle('hidden');
if (innerWidth <= 700) $('panel').classList.add('hidden');   // phone: first view is the scene + the small label; controls behind ☰
$('aptGo').onclick = () => loadAirport($('apt').value);
$('apt').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); loadAirport($('apt').value); } });
$('rwy').onchange = () => { AP.rwy = $('rwy').value; setMode('approach'); };
$('scenery').onclick = () => setScenery(!sceneryOn);
document.querySelectorAll('[data-wx]').forEach((b) => (b.onclick = () => setWeatherMode(b.dataset.wx)));
$('liveFind').onclick = () => findLive('');
$('liveGo').onclick = () => findLive($('liveQ').value);
$('liveQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); findLive($('liveQ').value); } });
$('liveLeave').onclick = leaveFlight;
$('realism').addEventListener('input', () => setRealManual(+$('realism').value));
$('realAuto').addEventListener('change', () => setRealAuto($('realAuto').checked));
setInterval(syncRealUI, 1000);   // enables the control once tiles have actually streamed in
if (/github\.io$/i.test(location.hostname)) setScenery(true);   // Auto realism needs the tiles: load them where the key works
$('glogo').onerror = () => { const s = document.createElement('b'); s.textContent = 'Google'; $('glogo').replaceWith(s); };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const pos = { x: 0, z: 0 };   // aircraft position over the ground (m), for ground motion
const att = new THREE.Euler(0, 0, 0, 'YXZ');
let viewHdg = null;   // comfort-smoothed heading used for the view (see the loop)
let last = performance.now(), dispClock = 1, uiClock = 1, efbClock = 1;
setTOD('day'); setSeat('captain');
loadAirport(params.get('apt') || 'KBNA', params.get('rwy'));
renderer.setAnimationLoop((now) => {
  // XR frames use the headset's clock: never let dt go negative or huge (that froze the flight and displays in VR)
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1)); last = now;
  const flying = demo && mode === 'approach' && airport;
  if (demo && !paused) { if (flying) approachStep(dt); else if (mode === 'cruise') demoStep(dt); }
  if (JOIN.hex) joinStep(dt);   // a real flight drives position and flight data
  else if (!paused && !flying) {   // move over the ground along the heading
    const gs = F.groundSpeed * 0.5144, h = F.heading * D2R;
    pos.x += -Math.sin(h) * gs * dt; pos.z += Math.cos(h) * gs * dt;
  }
  // world moves around the aircraft: inverse of aircraft attitude
  // VR comfort: the view's heading follows the flight data at no more than 30 deg/s (a live feed can jump), and in a
  // headset the horizon stays level (no roll). Snaps instead of spinning after a restart or a new airport.
  if (viewHdg === null) viewHdg = F.heading;
  else { const d = ((F.heading - viewHdg + 540) % 360) - 180; viewHdg = (viewHdg + Math.max(-30 * dt, Math.min(30 * dt, d)) + 360) % 360; }
  if (seat === 'outside' && !renderer.xr.isPresenting) {
    // Chase: the camera's frame follows the heading with a lag (no roll: horizon level); the aircraft itself pitches,
    // banks and turns ahead of the camera, so you see it manoeuvre against the scenery.
    chaseYaw = chaseYaw === null ? viewHdg : (chaseYaw + (((viewHdg - chaseYaw + 540) % 360) - 180) * (1 - Math.exp(-dt / 1.8)) + 360) % 360;
    att.set(0, -chaseYaw * D2R, 0); world.quaternion.setFromEuler(att).invert();
    aircraft.rotation.set(-F.pitch * D2R, -((((viewHdg - chaseYaw + 540) % 360) - 180) * D2R), F.bank * D2R, 'YXZ');
    if (!chaseDrag && (chaseIdle += dt) > 4) {   // ease back behind the aircraft after a few idle seconds
      const k = 1 - Math.exp(-dt * 0.8); camera.position.lerp(toWorld(SEATS.outside.eye), k); controls.target.lerp(toWorld(SEATS.outside.at), k);
    }
  } else {
    chaseYaw = null; aircraft.rotation.set(0, 0, 0);
    att.set(-F.pitch * D2R, -viewHdg * D2R, renderer.xr.isPresenting ? 0 : F.bank * D2R); world.quaternion.setFromEuler(att).invert();
  }
  const fieldFt = airport ? airport.data.elev_ft : 599;
  const gy = EYE_Y - EYE_AGL_GROUND - (F.altitude - fieldFt) * FT;   // ground height in the world frame
  ground.position.set(-(pos.x % TILE), gy - 0.05, -(pos.z % TILE));
  const real = sceneryStep(dt, gy);   // true once Google tiles are showing; they blend over our render (Realism)
  realismStep(dt); setNear(real ? 0.1 : 0.02); weatherStep(dt, gy);
  if ((efbClock += dt) > 0.5 && efbDirty !== null) { efbClock = 0; efb.draw(); }
  if (airport) { airport.group.position.set(orgOff[0] - pos.x, gy, orgOff[1] - pos.z); airport.group.visible = Math.hypot(orgOff[0] - pos.x, orgOff[1] - pos.z) < 60000; airport.update(now / 1000, camera, renderer, todLights); }
  landing.intensity = mode === 'approach' ? 900 : 0;
  if ((dispClock += dt) > 1 / 24) { dispClock = 0; redrawDisplays(); }   // ~24 Hz live displays
  if ((uiClock += dt) > 0.25) { uiClock = 0;
    $('readout').innerHTML = `<b>${r0(F.altitude).toLocaleString()}</b> ft · <b>${r0(F.airspeed)}</b> kt<br>HDG ${pad3(F.heading)}° · ${F.verticalSpeed >= 0 ? '+' : ''}${r0(F.verticalSpeed)} fpm<br>${F.phase}`; }
  if (!renderer.xr.isPresenting) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
