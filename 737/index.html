  T(x, 'FLAPS', 256, 350, 16, C.c); T(x, F.flaps ? String(F.flaps) : 'UP', 256, 378, 22, F.flaps ? C.g : C.w);
  T(x, F.gear ? 'GEAR DOWN' : 'GEAR UP', 256, 440, 22, F.gear ? C.g : C.w);
}
const DRAW = { pfd: drawPFD, nd: drawND, eng: drawENG, sys: drawSYS };
function redrawDisplays() { for (const d of displays) { DRAW[d.draw](d.ctx); d.tex.needsUpdate = true; } }

// ---------------------------------------------------------------------------
// Time of day
// ---------------------------------------------------------------------------
const TOD = {
  day:   { top: 0x2f6fc0, hor: 0xc4d8ea, bot: 0x6e7d6a, sun: 0xfff1d6, fog: 0xbfd3e4, hemi: 1.6, sunI: 1.6, dome: 0, disp: 1.0, gnd: 0xffffff, lights: 0.55 },
  dusk:  { top: 0x23305e, hor: 0xe39a6a, bot: 0x3b3a3a, sun: 0xffa060, fog: 0xc98a6e, hemi: 0.7, sunI: 0.7, dome: 1.0, disp: 0.9, gnd: 0x9a7a6a, lights: 1.0 },
  night: { top: 0x02040c, hor: 0x0f1a2c, bot: 0x050608, sun: 0x000000, fog: 0x0b1424, hemi: 0.06, sunI: 0.0, dome: 3.0, disp: 0.75, gnd: 0x1a1d24, lights: 1.35 },
};
let todLights = 0.55;
function setTOD(k) {
  const p = TOD[k]; todLights = p.lights;
  skyU.top.value.set(p.top); skyU.hor.value.set(p.hor); skyU.bot.value.set(p.bot); skyU.sunCol.value.set(p.sun);
  scene.fog.color.set(p.fog); hemi.intensity = p.hemi; sun.intensity = p.sunI; dome.intensity = p.dome;
  ground.material.color.set(p.gnd);
  todTint = p.gnd; if (scenery) scenery.setTint(p.gnd);
  for (const d of displays) d.mesh.material.color.setScalar(p.disp);
  document.querySelectorAll('[data-tod]').forEach((b) => b.classList.toggle('on', b.dataset.tod === k));
  todName = k; refreshMark();
}

// ---------------------------------------------------------------------------
// Seats / camera
// ---------------------------------------------------------------------------
const toWorld = (a) => v3(a).multiplyScalar(S);
let seat = 'captain';
function setSeat(k) {
  seat = k; const s = SEATS[k]; const eye = toWorld(s.eye), at = toWorld(s.at);
  document.querySelectorAll('[data-seat]').forEach((b) => b.classList.toggle('on', b.dataset.seat === k));
  dome.position.copy(toWorld([0, 2.6, 0.9]));
  if (renderer.xr.isPresenting) { placeRig(); return; }
  camera.position.copy(eye);
  if (s.orbit) {   // orbit around the nose
    controls.target.copy(at); controls.minDistance = 2; controls.maxDistance = 25; controls.rotateSpeed = 0.6; camera.fov = 50;
  } else {         // look around from a fixed head position
    const dir = at.clone().sub(eye).normalize();
    controls.target.copy(eye).addScaledVector(dir, 0.05); controls.minDistance = controls.maxDistance = 0.05; controls.rotateSpeed = -0.35; camera.fov = 72;
  }
  camera.updateProjectionMatrix(); controls.update();
}

// WebXR: the headset's starting point is put at the seat eye, facing the nose
const rig = new THREE.Group(); scene.add(rig);
function placeRig() {
  const s = SEATS[seat].orbit ? SEATS.captain : SEATS[seat];
  rig.position.copy(toWorld(s.eye)); rig.rotation.set(0, Math.PI, 0);
}
const markXR = MARK ? MARK.xrPanel(THREE) : null;   // I'M HERE card: small HUD tag low in the corner of view in VR
if (markXR) { markXR.visible = false; camera.add(markXR); }
renderer.xr.addEventListener('sessionstart', () => { if (markXR) markXR.visible = true; });
renderer.xr.addEventListener('sessionend', () => { if (markXR) markXR.visible = false; });
renderer.xr.addEventListener('sessionstart', () => { placeRig(); rig.add(camera); camera.position.set(0, 0, 0); camera.rotation.set(0, 0, 0); controls.enabled = false; });
renderer.xr.addEventListener('sessionend', () => { scene.add(camera); controls.enabled = true; setSeat(seat); });
const seatCycle = ['captain', 'fo', 'jump'];
for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i); rig.add(ctrl);
  ctrl.addEventListener('selectstart', () => setSeat(seatCycle[(seatCycle.indexOf(seat) + 1) % seatCycle.length]));
}

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
document.querySelectorAll('[data-seat]').forEach((b) => (b.onclick = () => setSeat(b.dataset.seat)));
document.querySelectorAll('[data-tod]').forEach((b) => (b.onclick = () => setTOD(b.dataset.tod)));
$('play').onclick = () => { paused = !paused; $('play').textContent = paused ? 'Play' : 'Pause'; $('play').classList.toggle('on', !paused); };
$('restart').onclick = () => setMode(mode);
document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
$('toggle').onclick = () => $('panel').classList.toggle('hidden');
if (innerWidth <= 700) $('panel').classList.add('hidden');   // phone: first view is the scene + the small label; controls behind ☰
$('aptGo').onclick = () => loadAirport($('apt').value);
$('apt').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); loadAirport($('apt').value); } });
$('rwy').onchange = () => { AP.rwy = $('rwy').value; setMode('approach'); };
$('scenery').onclick = () => setScenery(!sceneryOn);
$('glogo').onerror = () => { const s = document.createElement('b'); s.textContent = 'Google'; $('glogo').replaceWith(s); };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const pos = { x: 0, z: 0 };   // aircraft position over the ground (m), for ground motion
const att = new THREE.Euler(0, 0, 0, 'YXZ');
let last = performance.now(), dispClock = 1, uiClock = 1;
setTOD('day'); setSeat('captain');
loadAirport(params.get('apt') || 'KBNA', params.get('rwy'));
renderer.setAnimationLoop((now) => {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const flying = demo && mode === 'approach' && airport;
  if (demo && !paused) { if (flying) approachStep(dt); else if (mode === 'cruise') demoStep(dt); }
  if (!paused && !flying) {   // move over the ground along the heading
    const gs = F.groundSpeed * 0.5144, h = F.heading * D2R;
    pos.x += -Math.sin(h) * gs * dt; pos.z += Math.cos(h) * gs * dt;
  }
  // world moves around the aircraft: inverse of aircraft attitude
  att.set(-F.pitch * D2R, -F.heading * D2R, F.bank * D2R); world.quaternion.setFromEuler(att).invert();
  const fieldFt = airport ? airport.data.elev_ft : 599;
  const gy = EYE_Y - EYE_AGL_GROUND - (F.altitude - fieldFt) * FT;   // ground height in the world frame
  ground.position.set(-(pos.x % TILE), gy - 0.05, -(pos.z % TILE));
  const real = sceneryStep(dt, gy);   // true once Google tiles are showing: hide the flat ground and runway paint
  ground.visible = !real; for (const m of surfaces) m.visible = !real; setNear(real ? 0.1 : 0.02);
  if (airport) { airport.group.position.set(-pos.x, gy, -pos.z); airport.update(now / 1000, camera, renderer, todLights); }
  landing.intensity = mode === 'approach' ? 900 : 0;
  if ((dispClock += dt) > 1 / 15) { dispClock = 0; redrawDisplays(); }
  if ((uiClock += dt) > 0.25) { uiClock = 0;
    $('readout').innerHTML = `<b>${r0(F.altitude).toLocaleString()}</b> ft · <b>${r0(F.airspeed)}</b> kt<br>HDG ${pad3(F.heading)}° · ${F.verticalSpeed >= 0 ? '+' : ''}${r0(F.verticalSpeed)} fpm<br>${F.phase}`; }
  if (!renderer.xr.isPresenting) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
