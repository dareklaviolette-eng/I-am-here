<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>I'M HERE XR</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b12; color: #eaf4fb; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; width: 100%; height: 100%; }
  /* the EFB on screens: the very same canvas as in VR, in a panel on the right (full width on phones) */
  #efbPanel { position: fixed; right: calc(12px + env(safe-area-inset-right)); top: calc(66px + env(safe-area-inset-top)); z-index: 1700; width: min(400px, 94vw);
    filter: drop-shadow(0 10px 28px rgba(0,0,0,.45)); }
  #efbPanel { width: auto; }
  #efbPanel canvas { display: block; height: min(calc(100dvh - 150px), 560px); width: auto; max-width: 94vw; border-radius: 14px; touch-action: manipulation; }
  @media (max-width: 600px) { #efbPanel { left: 3vw; right: 3vw; top: calc(60px + env(safe-area-inset-top)); } #efbPanel canvas { height: auto; width: 100%; max-height: calc(100dvh - 140px); object-fit: contain; margin: 0 auto; } }
  .dockbar { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 1450; display: flex; gap: 8px; }
  .dockbar button { font: 600 13px ui-monospace, Menlo, monospace; color: rgba(255,255,255,.92); background: rgba(12,16,30,.6); border: .5px solid rgba(255,255,255,.28);
    border-radius: 22px; min-height: 44px; padding: 0 16px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .dockbar button:hover { border-color: rgba(160,220,255,.7); }
  #efbBtn svg { width: 20px; height: 20px; }
  #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 1650; padding: 10px 18px; border-radius: 22px;
    background: rgba(8,18,32,.86); border: 1px solid rgba(111,220,255,.7); font: 600 15px system-ui, sans-serif; opacity: 0; transition: opacity .35s; pointer-events: none;
    white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; }
  .side-list { display: flex; flex-direction: column; gap: 2px; padding: 4px 6px 8px; }
  .side-list button { text-align: left; background: none; border: 0; border-radius: 7px; min-height: 40px; padding: 4px 10px; color: rgba(255,255,255,.92); font: 13px ui-monospace, Menlo, monospace; cursor: pointer; }
  .side-list button:hover { background: rgba(60,110,150,.6); }
  .side-list button[aria-current="true"] { background: rgba(40,80,110,.65); }
  .side-h { padding: 8px 10px 2px; font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .12em; color: rgba(110,220,235,.7); text-transform: uppercase; }
  body.xr-arriving .ihb, body.xr-arriving .imc, body.xr-arriving .dockbar, body.xr-arriving #efbPanel, body.xr-arriving #toast { visibility: hidden; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 14px ui-monospace, Menlo, monospace; letter-spacing: .2em; color: #9fe8ff; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }
</script>
<script src="../shared/xr-safety.js"></script>
<script src="../shared/imhere-card.js"></script>
<script src="../shared/imhere-topbar.js"></script>
</head>
<body>
<div id="view"></div>
<div id="boot">I'M HERE</div>
<div id="efbPanel" hidden></div>
<div class="dockbar">
  <button id="efbBtn" type="button" aria-label="Where do you want to be?"><svg viewBox="0 0 24 24" fill="none" stroke="#9fe8ff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Where to?</button>
  <button id="vrBtn" type="button" hidden>Enter VR</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
import { startShell } from '../shared/shell/shell.js';
startShell().then(() => { const b = document.getElementById('boot'); if (b) b.remove(); })
  .catch((e) => { console.error(e); const b = document.getElementById('boot'); if (b) b.textContent = "I'M HERE XR could not start: " + (e && e.message || e); });
</script>
</body>
</html>
