<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>I'M HERE · Space &amp; Earth</title>
<style>

  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; }
  #info { top: calc(10px + env(safe-area-inset-top) + var(--imh-h, 0px)); left: 10px; padding: 9px 12px; max-width: min(360px, calc(100vw - 20px)); font-size: 12.5px; }
  #info h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acc); font-weight: 650; display: flex; gap: 8px; align-items: center; cursor: pointer; user-select: none; }
  #info h1 .chev { margin-left: auto; color: var(--dim); font-size: 11px; }
  #info.collapsed .body { display: none; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .row span:first-child { color: var(--dim); }
  .note { color: var(--dim); font-size: 11px; margin-top: 6px; }
  #bar { left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); padding: 8px; width: min(560px, calc(100vw - 16px)); display: flex; flex-direction: column; gap: 7px; }
  .btns { display: flex; gap: 6px; }
  .btns button { flex: 1; min-height: 40px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: var(--fg); border-radius: 9px; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px 6px; }
  .btns button.on { background: rgba(124,196,255,0.22); border-color: var(--acc); color: #fff; }
  .btns.small button { min-height: 32px; font-size: 12px; font-weight: 550; }
  .time { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .time input { flex: 1; accent-color: var(--acc); height: 28px; }
  #when { min-width: 132px; text-align: right; font-variant-numeric: tabular-nums; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(8px, -50%); font-size: 12px; color: #dfe8f7; text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; }

// ---------------------------------------------------------------- Earth textures (procedural colours on real coastlines)
function buildEarthTexture() {
  const land = (LAND_MASK = decodeLand()), W = LAND_W, H = LAND_H;
  // Distance-from-coast proxy: blurred land fraction (wrap in x), via running sums.
  const blur = (src, r) => {
    const tmp = new Float32Array(W * H), out = new Float32Array(W * H);
    for (let y = 0; y < H; y++) {
      let s = 0; const o = y * W;
      for (let k = -r; k <= r; k++) s += src[o + ((k + W) % W)];
      for (let x = 0; x < W; x++) { tmp[o + x] = s / (2 * r + 1); s += src[o + ((x + r + 1) % W)] - src[o + ((x - r + W) % W)]; }
    }
    for (let x = 0; x < W; x++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += tmp[Math.min(H - 1, Math.max(0, k)) * W + x];
      for (let y = 0; y < H; y++) { out[y * W + x] = s / (2 * r + 1); s += tmp[Math.min(H - 1, y + r + 1) * W + x] - tmp[Math.max(0, y - r) * W + x]; }
    }
    return out;
  };
  const inland = blur(blur(land, 28), 28), shelf = blur(land, 6);
  const data = new Uint8Array(W * H * 4);
  const mix = (a, b, t) => a + (b - a) * t, cl = (x) => Math.max(0, Math.min(1, x));
  for (let y = 0; y < H; y++) {
    const lat = 90 - (y + 0.5) * 180 / H, alat = Math.abs(lat);
    const row = (H - 1 - y) * W; // DataTexture row 0 = south
    const belt = Math.exp(-(((alat - 25) / 7) ** 2));
    const steppe = lat > 0 ? 0.75 * Math.exp(-(((lat - 44) / 7) ** 2)) : 0;
    for (let x = 0; x < W; x++) {
      const i = y * W + x, o = (row + x) * 4, lon = -180 + (x + 0.5) * 360 / W;
      if (land[i]) {
        const inl = cl((inland[i] - 0.45) / 0.5);
        let dry = cl(belt * (0.35 + 0.95 * inl) + steppe * inl * inl);
        let r = mix(38, 92, cl(dry * 1.6)), g = mix(72, 104, cl(dry * 1.6)), b = mix(34, 52, cl(dry * 1.6));
        const des = cl((dry - 0.55) / 0.3);
        r = mix(r, 196, des); g = mix(g, 166, des); b = mix(b, 116, des);
        const tund = cl((alat - 55) / 10);
        r = mix(r, 104, tund); g = mix(g, 100, tund); b = mix(b, 82, tund);
        const ice = lat < -60 || (lat > 59.5 && lon > -74 && lon < -11 && inland[i] > 0.2) || lat > 78 ? 1 : cl((alat - 72) / 6) * 0.7;
        r = mix(r, 236, ice); g = mix(g, 241, ice); b = mix(b, 246, ice);
        data[o] = r; data[o + 1] = g; data[o + 2] = b; data[o + 3] = 255;
      } else {
        const sh = cl(shelf[i] * 2.2), polar = cl((alat - 66) / 14);
        data[o] = mix(mix(6, 22, sh), 30, polar); data[o + 1] = mix(mix(26, 74, sh), 52, polar); data[o + 2] = mix(mix(66, 118, sh), 84, polar); data[o + 3] = 0;
      }
    }
  }
  const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat);
  tex.wrapS = THREE.RepeatWrapping; tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true; tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); tex.needsUpdate = true;
  return tex;
}

const NOISE_GLSL = /* glsl */`
float hash3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 x) {

}
float fbm(vec3 p, int oct) { float a = 0.5, s = 0.0; for (int k = 0; k < 7; k++) { if (k >= oct) break; s += a * vnoise(p); p = p * 2.03 + 1.7; a *= 0.5; } return s; }

        { kind: 'computed', label: 'Planet positions', source: 'JPL approximate Keplerian elements (valid 1800–2050), calculated for the time shown',
          note: now <= MIN_MS || now >= MAX_MS ? 'Outside 1800–2050: positions are not reliable.' : '' },
        { kind: 'illustrative', label: 'Scale', source: 'Directions are true; distances are compressed and planet sizes enlarged so everything fits' },
        when || { kind: 'computed', label: 'Time shown: now', source: 'Your device clock' }] });
    MARK.setLive(false);
    return;
  }
  const sub = issLatLonAt(now);
  const iss = liveNow
    ? { kind: 'live', label: 'ISS position', source: 'wheretheiss.at (polled every 15 s), smoothed along the orbit between fixes', time: issState.lastFix, timeLabel: 'Last fix' }
    : issState.mode === 'live' || issState.mode === 'live-pending'
      ? { kind: 'estimated', label: 'ISS position', source: 'Propagated from the last live fix (wheretheiss.at), approximate', time: issState.lastFix, timeLabel: 'Last fix',
          note: shifted ? 'Time is shifted away from now, so this is not the live position.' : 'Waiting for fresh live fixes.' }
      : { kind: 'simulated', label: 'ISS position', source: 'Simulated orbit, not the live position (no live data reached this page)',
          note: 'Realistic 51.6°, ~420 km, 92.7 min circular orbit; where the ISS is along it is made up.' };
  MARK.update({ context: 'ISS · over ' + coarseRegion(sub.lat, sub.lon, isLand), loc: 'Low Earth orbit, ' + Math.round(orbit.altKm) + ' km',
    signal: iss.kind === 'simulated' ? { text: 'Demo data' } : { source: 'wheretheiss.at', time: issState.lastFix }, view: '3D render',
    tag: liveNow ? { text: 'fix ' + ago(issState.lastFix) } : iss.kind === 'estimated' ? { text: 'Fix ' + ago(issState.lastFix) + ', estimated', kind: 'estimated' } : { text: 'Simulated orbit', kind: 'simulated' },
    stats: [['Alt', Math.round(orbit.altKm) + ' km'], ['Speed', (2 * Math.PI * orbit.a / (orbit.periodMin * 60)).toFixed(2) + ' km/s'], ['Orbit', orbit.periodMin.toFixed(1) + ' min'], ['Over', fmtLat(sub.lat) + ' ' + fmtLon(sub.lon)], ['NORAD', '25544']],
    items: [iss,
      { kind: 'illustrative', label: 'ISS model', source: 'Simplified shape drawn by I\'M HERE (real size, solar arrays turned to the Sun)' },
      { kind: 'computed', label: 'Sun and day/night line', source: 'Calculated from the real Sun position for the time shown' },
      { kind: 'data', label: 'Coastlines', source: 'Natural Earth (public domain) land mask' },
      { kind: 'illustrative', label: 'Land colours and clouds', source: 'Drawn by I\'M HERE: not satellite or live imagery' },
      when || { kind: 'computed', label: 'Time shown: now', source: 'Your device clock' }] });
  MARK.setLive(liveNow);
}

// ---------------------------------------------------------------- frame loop
const issPos = new THREE.Vector3(), issPrev = new THREE.Vector3(), up = new THREE.Vector3(), fwd = new THREE.Vector3(), right = new THREE.Vector3();
const _q = new THREE.Quaternion(), m4 = new THREE.Matrix4(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
let trackNext = 0, orbitNext = 0;
function issLatLonAt(ms) { return orbitLatLon(orbit, ms); }
function frame() {
  const realNow = performance.now(), dt = Math.min(0.25, (realNow - lastReal) / 1000); lastReal = realNow; frameDt = dt;
  simDrift += dt * 1000 * (speed - 1);
  let now = Date.now() + offsetDays * 86400000 + simDrift;
  now = Math.max(MIN_MS, Math.min(MAX_MS, now));
  simMs = now;
  const shiftDays = (now - Date.now()) / 86400000;
  whenEl.textContent = Math.abs(shiftDays) < 1 / 1440 ? 'now' : (shiftDays > 0 ? '+' : '−') + (Math.abs(shiftDays) < 2 ? (Math.abs(shiftDays) * 24).toFixed(1) + ' h' : Math.abs(shiftDays).toFixed(0) + ' d');

  const ss = subsolar(now);
  latLonVec(ss.lat, ss.lon, 1, sunDirECEF);
  const gst = gmstDeg(now) * D2R;
  stars.rotation.y = -gst;

  if (view === 'planets') renderPlanets(now, ss); else renderEarth(now, ss);
  if (realNow > infoNext && !infoEl.classList.contains('collapsed')) { infoNext = realNow + 500; updateInfo(now, ss, issLatLonAt(now)); }
  if (realNow > markNext) { markNext = realNow + 1000; refreshMark(now); }
}
function applyPose(xrScale) {
  rig.position.copy(poser.position);
  // VR comfort: in a headset (or at fast time speeds) the ride/chase view turns at most 30 deg/s, so a fast orbit never
  // spins the camera; the "up" of the ride/chase frames is the local zenith, so the horizon stays level (no roll).
  const capped = !poseSnap && (view === 'ride' || view === 'chase') && (renderer.xr.isPresenting || speed > 1);
  if (capped) rig.quaternion.rotateTowards(poser.quaternion, (30 * Math.PI / 180) * frameDt); else rig.quaternion.copy(poser.quaternion);
  poseSnap = false;
  rig.scale.setScalar(renderer.xr.isPresenting ? xrScale : 1); // in VR: 1 headset metre = 1 real metre near the ISS
  camera.updateProjectionMatrix(); rig.updateMatrixWorld(true);
}
function hiddenByEarth(eye, p) { // does the segment eye->p pass through the Earth (radius 1)?
  const d = tmp2.copy(p).sub(eye), L = d.length(); d.divideScalar(L);
  const t = Math.max(0, Math.min(L, -eye.dot(d)));
  return eye.lengthSq() + 2 * t * eye.dot(d) + t * t < 0.999;
}
function renderEarth(now, ss) {
  for (const k in labels) if (!k.startsWith('e:')) labels[k].style.display = 'none';
  const sub = issLatLonAt(now), sub2 = issLatLonAt(now + 1000);
  latLonVec(sub.lat, sub.lon, 1 + sub.altKm * KM, issPos);
  latLonVec(sub2.lat, sub2.lon, 1 + sub2.altKm * KM, tmp);
  up.copy(issPos).normalize(); fwd.copy(tmp).sub(issPos); fwd.addScaledVector(up, -fwd.dot(up)).normalize(); right.crossVectors(fwd, up).normalize();
  // ISS attitude: x = velocity, y = zenith, z = right (LVLH-like)
  m4.makeBasis(fwd, up, right); iss.quaternion.setFromRotationMatrix(m4); iss.position.copy(issPos);
  issMarker.position.copy(issPos);
  { // point the arrays at the Sun: sun direction in the ISS body frame, angle about the truss (z) axis
    const sb = tmp.copy(sunDirECEF).applyQuaternion(_q.copy(iss.quaternion).invert());
    for (const a of iss.userData.alpha) a.rotation.z = Math.atan2(sb.y, sb.x);
  }
  sunSprite.position.copy(sunDirECEF).multiplyScalar(20000); sunSprite.scale.setScalar(20000 * 0.0093 * 7);
  sunLight.position.copy(issPos).addScaledVector(sunDirECEF, 10); sunLight.target.position.copy(issPos);
  cloudMat.uniforms.time.value = ((now / 8.64e8) % 1) * 2 * Math.PI;

  if (performance.now() > trackNext) {
    trackNext = performance.now() + 1000;
    const arr = trackGeo.attributes.position.array, span = orbit.periodMin * 60000 * 1.5;
    for (let k = 0; k < TRACK_N; k++) { const q = issLatLonAt(now + (k / (TRACK_N - 1)) * span); latLonVec(q.lat, q.lon, 1.0015, tmp2).toArray(arr, k * 3); }
    trackGeo.attributes.position.needsUpdate = true; trackGeo.computeBoundingSphere();
  }

  const c = ctl[view];
  iss.visible = view !== 'ride';
  issMarker.visible = view === 'earth';
  track.visible = view !== 'ride';
  camera.near = view === 'earth' ? 0.01 : 1e-7;
  camera.fov = view === 'ride' ? c.fov : 50;
  if (view === 'earth') {
    if (!earthYawSet) { // frame the ISS and the sunlit side together
      tmp.copy(issPos).normalize().add(sunDirECEF).normalize();
      c.yaw = Math.atan2(-tmp.z, tmp.x); c.pitch = Math.max(-0.9, Math.min(0.9, Math.asin(tmp.y))); earthYawSet = true;
    }
    latLonVec(c.pitch * R2D, c.yaw * R2D, c.dist, poser.position);
    poser.up.set(0, 1, 0); poser.lookAt(0, 0, 0);
  } else if (view === 'chase') {
    tmp.copy(fwd).multiplyScalar(-Math.cos(c.pitch) * Math.cos(c.yaw)).addScaledVector(right, Math.cos(c.pitch) * Math.sin(c.yaw)).addScaledVector(up, Math.sin(c.pitch));
    poser.position.copy(issPos).addScaledVector(tmp, c.dist);
    poser.up.copy(up); poser.lookAt(issPos);
  } else { // ride: Cupola-style view, looking ahead and down; drag to look around
    poser.position.copy(issPos).addScaledVector(up, -4 * ISS_M);
    tmp.copy(fwd).multiplyScalar(Math.cos(c.yaw)).addScaledVector(right, Math.sin(c.yaw));
    tmp.multiplyScalar(Math.cos(c.pitch)).addScaledVector(up, Math.sin(c.pitch));
    poser.up.copy(up); poser.lookAt(tmp2.copy(poser.position).add(tmp));
  }
  applyPose(view === 'earth' ? 1 : ISS_M);
  issMarker.scale.setScalar(view === 'earth' ? 0.035 : 0.0);
  placed = [];
  if (view === 'earth') placeLabel(label('e:iss', 'ISS'), issPos, camera, !hiddenByEarth(rig.position, issPos));
  else if (labels['e:iss']) labels['e:iss'].style.display = 'none';
  renderer.render(earthScene, camera);
}
function renderPlanets(now, ss) {
  if (labels['e:iss']) labels['e:iss'].style.display = 'none';
  const T = centuries(now);
  for (const name of Object.keys(PL)) {
    const P = planets[name];
    toScene(helio(name, now), P.mesh.position);
    if (Math.abs(T - P.lastOrbitT) > 0.02) updateOrbitLine(name, T);
  }
  const c = ctl.planets;
  camera.near = 0.05; camera.fov = 50;
  poser.position.set(Math.cos(c.pitch) * Math.sin(c.yaw), Math.sin(c.pitch), Math.cos(c.pitch) * Math.cos(c.yaw)).multiplyScalar(c.dist);
  poser.up.set(0, 1, 0); poser.lookAt(0, 0, 0);
  applyPose(1);
  planetScene.add(rig);
  renderer.render(planetScene, camera);
  earthScene.add(rig);
  placed = [];
  placeLabel(label('p:Sun', 'Sun', 'sun'), sunBall.position, camera);
  for (const name of Object.keys(PL)) placeLabel(label('p:' + name, name === 'Earth' ? 'Earth (you are here)' : name), planets[name].mesh.position, camera);
}

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

earthMat.uniforms.map.value = buildEarthTexture();
setView('earth');
renderer.setAnimationLoop(frame);

// Optional VR button: only when the device supports immersive VR; failures are silent.
(async () => {
  try {
    if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-vr'))) return;
    const { VRButton } = await import('three/addons/webxr/VRButton.js');
    const b = VRButton.createButton(renderer); document.getElementById('vrslot').appendChild(b);
    renderer.xr.addEventListener('sessionstart', () => { if (view === 'earth') setView('chase'); });
    setupVRMenu();
  } catch { /* VR is optional */ }
})();

// In-headset controls: a small console at waist height in front of you (it travels with you, not with your head).
// Point a controller (or pinch with hand tracking) at a button: views (Ride the ISS, Chase, Earth, Planets) and time speeds.
function setupVRMenu() {
  const W = 1024, H = 300, c = document.createElement('canvas'); c.width = W; c.height = H;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const rows = [
    [['Ride the ISS', () => setView('ride'), () => view === 'ride'], ['Chase', () => setView('chase'), () => view === 'chase'],
     ['Earth', () => setView('earth'), () => view === 'earth'], ['Planets', () => setView('planets'), () => view === 'planets']],
    [['Real time', () => setSpeed(1), () => speed === 1], ['60×', () => setSpeed(60), () => speed === 60], ['600×', () => setSpeed(600), () => speed === 600],
     ['1 day/s', () => setSpeed(86400), () => speed === 86400], ['Now', () => document.getElementById('nowBtn').click(), () => false]],
  ];
  let hover = null, sig = '';
  function draw() {
    const nsig = JSON.stringify([rows.map((r) => r.map((b) => b[2]())), hover]); if (nsig === sig) return; sig = nsig;
    const g = c.getContext('2d'); g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(8,12,22,0.82)'; g.beginPath(); g.roundRect ? g.roundRect(0, 0, W, H, 28) : g.rect(0, 0, W, H); g.fill();
    rows.forEach((r, ri) => r.forEach((b, bi) => {
      const bw = (W - 40) / r.length, x = 20 + bi * bw, y = 20 + ri * 135, on = b[2](), hv = hover && hover[0] === ri && hover[1] === bi;
      g.fillStyle = on ? 'rgba(124,196,255,0.35)' : hv ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.08)';
      g.beginPath(); g.roundRect ? g.roundRect(x + 6, y, bw - 12, 120, 18) : g.rect(x + 6, y, bw - 12, 120); g.fill();
      g.fillStyle = '#fff'; g.font = '600 ' + (ri ? 34 : 38) + 'px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(b[0], x + bw / 2, y + 60);
    }));
    tex.needsUpdate = true;
  }
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62 * H / W), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
  panel.renderOrder = 9000; panel.frustumCulled = false; panel.visible = false;
  panel.position.set(0, -0.42, -0.62); panel.rotation.x = -0.75;   // like a console you look down at
  rig.add(panel); draw();
  const ray = new THREE.Raycaster(), m4 = new THREE.Matrix4();
  const hit = (ctrl) => {
    m4.identity().extractRotation(ctrl.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(ctrl.matrixWorld); ray.ray.direction.set(0, 0, -1).applyMatrix4(m4);
    const h = ray.intersectObject(panel)[0]; if (!h || !h.uv) return null;
    const px = h.uv.x * W, py = (1 - h.uv.y) * H, ri = py < 155 ? 0 : 1, r = rows[ri], bi = Math.floor((px - 20) / ((W - 40) / r.length));
    return bi >= 0 && bi < r.length ? [ri, bi] : null;
  };
  const ctrls = [0, 1].map((i) => {
    const ctrl = renderer.xr.getController(i); rig.add(ctrl);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1.2)]),
      new THREE.LineBasicMaterial({ color: 0x7cc4ff, transparent: true, opacity: 0.6, depthTest: false }));
    line.renderOrder = 9001; line.frustumCulled = false; ctrl.add(line);
    ctrl.addEventListener('select', () => { const b = hit(ctrl); if (b) rows[b[0]][b[1]][1](); draw(); });
    return ctrl;
  });
  renderer.xr.addEventListener('sessionstart', () => { panel.visible = true; });
  renderer.xr.addEventListener('sessionend', () => { panel.visible = false; });
  setInterval(() => { if (!renderer.xr.isPresenting) return; let h = null; for (const ct of ctrls) h = h || hit(ct); hover = h; draw(); }, 100);
}
