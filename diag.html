<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Scenery check</title><style>body{font:18px system-ui;background:#0b1220;color:#e8eef7;padding:24px}pre{white-space:pre-wrap;background:#16233a;padding:14px;border-radius:8px;font-size:15px}</style></head>
<body><h2>Google scenery check</h2><pre id="o">Checking…</pre>
<script>
(async()=>{const o=document.getElementById('o');try{
const r=await fetch('https://tile.googleapis.com/v1/3dtiles/root.json?key=AIzaSyD5_qsBFe74zBURZ8UTYFzz_7es3dPSM9A');
const t=await r.text();o.textContent='Status: '+r.status+'\n\n'+t.slice(0,800);}
catch(e){o.textContent='Could not connect: '+e;}})();
</script></body></html>
