<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yosemite · I'M HERE Travel Desk</title>
<meta name="theme-color" content="#0b1424">
<style>
  :root { --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; --cyan: rgba(110,220,235,.75); --panel: rgba(12,16,30,.6); --line: rgba(255,255,255,.28); }
  html, body { margin: 0; height: 100%; background: #0b1424; color: rgba(255,255,255,.92); overflow: hidden; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; width: 100%; height: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }

  /* narration caption: lower third, the same dark glass as the card */
  #cap { position: fixed; z-index: 1400; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(640px, calc(100vw - 20px));
    box-sizing: border-box; background: var(--panel); border: .5px solid var(--line); border-radius: 10px; padding: 12px 14px 10px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: opacity .5s; }
  #cap.fade { opacity: 0; }
  #capHead { display: flex; align-items: baseline; gap: 10px; }
  #capStep { font: 11px var(--mono); letter-spacing: .08em; color: var(--cyan); white-space: nowrap; }
  #capTitle { font-weight: 650; font-size: 18px; letter-spacing: .01em; }
  #capWx { margin-left: auto; font: 12px var(--mono); color: rgba(255,255,255,.7); white-space: nowrap; }
  #capText { margin: 6px 0 8px; color: rgba(255,255,255,.88); }
  #capNote { margin: -4px 0 8px; font-size: 12px; color: rgba(255,255,255,.55); }
  #capCtl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .cb { background: rgba(12,16,30,.55); border: .5px solid var(--line); border-radius: 7px; min-height: 40px; min-width: 44px; padding: 0 12px; cursor: pointer; font: 13px var(--mono); white-space: nowrap; }
  .cb:hover { border-color: rgba(160,220,255,.7); } .cb:focus-visible { outline: 2px solid #7cc4ff; outline-offset: 1px; }
  .cb[aria-pressed="true"] { background: rgba(43,81,112,.78); border-color: rgba(160,220,255,.7); }
  #capCtl .sp { flex: 1; }
  #prog { height: 2px; margin-top: 8px; background: rgba(255,255,255,.12); border-radius: 1px; overflow: hidden; }
  #prog i { display: block; height: 100%; width: 0; background: rgba(110,220,235,.7); }
  @media (max-width: 520px) { #cap { padding: 10px 11px 8px; } #capTitle { font-size: 16px; } #capText { font-size: 14px; } #capWx { display: none; } .cb { padding: 0 9px; } }
  @media (max-height: 520px) and (orientation: landscape) { #capText { display: none; } }

  /* field guide: an EFB-style panel on the right */
  #efb { position: fixed; z-index: 1590; right: calc(10px + env(safe-area-inset-right)); top: calc(var(--ihb-top, 64px) + env(safe-area-inset-top));
    width: min(380px, calc(100vw - 20px)); max-height: calc(100dvh - var(--ihb-top, 64px) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display: flex; flex-direction: column; box-sizing: border-box; background: rgba(14,20,32,.9); border: 1px solid rgba(255,255,255,.22); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); overflow: hidden; }
  #efbHead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; border-bottom: .5px solid rgba(255,255,255,.18); font: 600 12px var(--mono); letter-spacing: .1em; color: var(--cyan); }
  #efbHead .x { margin-left: auto; }
  #efbTabs { display: flex; gap: 6px; padding: 8px 10px; }
  #efbTabs .cb { min-height: 34px; font-size: 12px; }
  #efbList { overflow: auto; padding: 0 10px 12px; overscroll-behavior: contain; }
  .sp-card { border: .5px solid rgba(255,255,255,.18); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: rgba(255,255,255,.03); }
  .sp-card h3 { margin: 0; font-size: 15.5px; } .sp-card .sci { font-style: italic; color: rgba(255,255,255,.6); font-size: 13px; }
  .sp-card .tags { margin: 5px 0 2px; display: flex; gap: 6px; flex-wrap: wrap; font: 10.5px var(--mono); letter-spacing: .06em; }
  .sp-card .tags span { padding: 2px 6px; border-radius: 4px; background: rgba(110,220,235,.12); color: var(--cyan); }
  .sp-card .tags .end { background: rgba(255,191,71,.15); color: #ffbf47; }
  .sp-card p { margin: 6px 0 0; font-size: 13.5px; color: rgba(255,255,255,.85); }
  .sp-card .k { font: 10.5px var(--mono); letter-spacing: .08em; color: var(--cyan); margin-right: 6px; }
  .sp-card .ph { margin-top: 6px; font: 10.5px var(--mono); color: rgba(255,255,255,.4); }

  /* sidebar contents (inside shared/imhere-topbar.js sections) */
  .sb-list { display: flex; flex-direction: column; padding: 0 6px 8px; }
  .sb-list button { display: flex; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 7px; min-height: 42px; padding: 6px 8px; cursor: pointer; font: 13px var(--mono); }
  .sb-list button:hover { background: rgba(60,110,150,.5); } .sb-list button[aria-current="true"] { background: rgba(40,80,110,.65); }
  .sb-list .n { color: var(--cyan); width: 1.6em; } .sb-list .s { margin-left: auto; color: rgba(255,255,255,.5); font-size: 11px; }
  .sb-about { padding: 0 14px 12px; font-size: 13px; color: rgba(255,255,255,.8); }
  .sb-about p { margin: 0 0 8px; }

  #blink { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5000; }
  #status { position: fixed; z-index: 1300; left: calc(12px + env(safe-area-inset-left)); bottom: calc(8px + env(safe-area-inset-bottom)); font: 11px var(--mono); color: rgba(255,255,255,.6);
    text-shadow: 0 0 3px rgba(0,0,0,.8); pointer-events: none; transition: opacity 1s; max-width: 46vw; }
  #status.fade { opacity: 0; }
  @media (max-width: 760px) { #status { left: auto; right: calc(12px + env(safe-area-inset-right)); bottom: auto; text-align: right; top: calc(var(--ihb-top, 64px) + 4px + env(safe-area-inset-top)); } }
  @media (min-width: 1100px) { body.guide-open #cap { left: calc(50% - 190px); } }

  #auroraWelcome { position: fixed; z-index: 4000; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.98); text-align: center; pointer-events: none; opacity: 0; transition: opacity 1.1s, transform 1.1s; }
  #auroraWelcome.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #auroraWelcome .aw-k { font: 11px var(--mono); letter-spacing: .22em; color: var(--cyan); }
  #auroraWelcome .aw-t { font: 300 clamp(26px, 5vw, 44px)/1.15 system-ui, sans-serif; letter-spacing: .04em; margin: 6px 0 4px; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  #auroraWelcome .aw-s { font-size: 14px; color: rgba(255,255,255,.75); text-shadow: 0 1px 8px rgba(0,0,0,.7); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }
</script>
<script src="../../shared/xr-safety.js"></script>
<script src="../../shared/imhere-card.js"></script>
<script src="../../shared/imhere-topbar.js"></script>
</head>
<body>
<div id="view"></div>

<section id="cap" aria-live="polite">
  <div id="capHead"><span id="capStep">STOP 1 / 7</span><span id="capTitle">Tunnel View</span><span id="capWx"></span></div>
  <p id="capText"></p>
  <p id="capNote" hidden></p>
  <div id="capCtl">
    <button class="cb" id="prevBtn" type="button" aria-label="Previous stop">‹ Prev</button>
    <button class="cb" id="autoBtn" type="button" aria-pressed="true">❚❚ Auto</button>
    <button class="cb" id="nextBtn" type="button" aria-label="Next stop">Next ›</button>
    <span class="sp"></span>
    <button class="cb" id="guideBtn" type="button" aria-pressed="false">Field guide</button>
    <button class="cb" id="vrBtn" type="button" hidden>Enter VR</button>
  </div>
  <div id="prog"><i></i></div>
</section>

<aside id="efb" hidden aria-label="Field guide">
  <div id="efbHead"><span>FIELD GUIDE · YOSEMITE</span><button class="cb x" id="efbClose" type="button" aria-label="Close the field guide">✕</button></div>
  <div id="efbTabs"><button class="cb" id="tabHere" type="button" aria-pressed="true">Here</button><button class="cb" id="tabAll" type="button" aria-pressed="false">All species</button></div>
  <div id="efbList"></div>
</aside>

<div id="status" role="status"></div>
<div id="blink" aria-hidden="true"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
