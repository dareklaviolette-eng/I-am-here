<script id="imhere-xr">
// I'M HERE: guaranteed ways out of VR, a crash-proof frame loop, and a frame-cost watchdog. Plain script, no imports.
// window.ImHereXR.install({ THREE, renderer, scene, camera, rays, scale, place: { right, down, ahead }, onQuality(level), onExit })
// Call it right after the renderer and camera exist, before renderer.setAnimationLoop and before entering VR.
//  - Exit VR: a big red button that stays in view (it follows your head lazily, low and to the right). Point a controller

//    session lingers). Nothing here calls preventDefault or captures any system input.
//  - The page's frame callback is wrapped in try/catch: an error is logged (rate-limited) and the next frame still comes.

//  - Watchdog: frames over 50 ms for most of 2 s -> onQuality(1), then 2.5 s later onQuality(2) (the page lightens its scene).

//  - No allocations per frame (beyond what WebXR itself returns for poses).

//                        obj.userData.exitIgnore = 'left' ignores that hand (a wrist panel on that hand); hover calls
//                        obj.userData.onExitHover(bool). Only counted while the object and its parents are visible.
//                        api.exitTargets is the live array (push more later).
//    exitButtons: [5]    gamepad buttons that exit (default [4, 5] = A/X and B/Y; [5] = B and Y only, so A/X stay free)

      if (!s) return;
      api.lastExit = reason;
      try { console.warn('[I\'M HERE VR] exit: ' + reason); } catch (e) { /* ignore */ }
      if (o.onExit) try { o.onExit(reason); } catch (e) { logErr('onExit', e); }
      try { var p = s.end(); if (p && p.catch) p.catch(function (e) { logErr('session.end', e); }); } catch (e) { logErr('session.end', e); }

        var s2 = null; try { s2 = xr.getSession && xr.getSession(); } catch (e) { /* ignore */ }
        if (s2 === s) { try { var p2 = s.end(); if (p2 && p2.catch) p2.catch(function () {}); } catch (e) { logErr('session.end retry', e); } }
      }, 1200);
    }
    api.exit = exit;

    // ---- per-frame: button placement, input, hit testing (all in the rig's local space; preallocated temporaries)
    var Minv = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(),
      lo = new THREE.Vector3(), ld = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1), sc = new THREE.Vector3(), e3 = new THREE.Euler();
    var TM = new THREE.Matrix4(), TMinv = new THREE.Matrix4();
    var PL = { right: 0.24, down: 0.24, ahead: 0.6 }; if (o.place) for (var k in o.place) PL[k] = o.place[k];
    var anchorYaw = null, prevDown = [false, false, false, false], hovered = false, invOk = false;

    function inv() { if (!invOk) { Minv.copy(btn.matrix).invert(); invOk = true; } return Minv; }

    function pokeIn(frame, src, ref, Mi, cx, cy, hw, hh) {   // index fingertip pressed into the rectangle (hand tracking)
      if (!src.hand || !frame.getJointPose) return false;

      try { xr.setFoveation(1); } catch (e) { /* ignore */ }
      api.shadow = renderer.shadowMap.enabled; renderer.shadowMap.enabled = false;
      if (s) { s.addEventListener('selectstart', onSelectStart); s.addEventListener('visibilitychange', onVis); }
      attach();
      clearInterval(W.timer);
      W.timer = setInterval(function () {   // the loop stopped delivering frames altogether
        var s1 = null; try { s1 = xr.getSession && xr.getSession(); } catch (e) { /* ignore */ }
        if (!xr.isPresenting || !s1 || s1.visibilityState !== 'visible') { W.last = 0; return; }   // system menu open / headset off
        var now = performance.now();
        if (W.last && now - W.last > 2500 && now - W.start > 6000) stopVR('no frames for 2.5 seconds');
      }, 500);
    });
    xr.addEventListener('sessionend', function () {
      clearInterval(W.timer); clearTimeout(ending);
      btn.visible = false; if (hint) hint.visible = false; rays.forEach(function (l) { l.visible = false; });
      api.exitTargets.forEach(function (t) { if (t) setTargetHover(t, false); });
      if (api.shadow) renderer.shadowMap.enabled = true;
      if (api.level && o.onQuality) try { o.onQuality(0); } catch (e) { logErr('onQuality', e); }
      api.level = 0;
    });
    api.button = btn; api.renderer = renderer;
    api.sessionInit = { optionalFeatures: ['hand-tracking'] };
    window.ImHereXR.current = api;   // for tests and the console
    return api;
  }
  window.ImHereXR = { install: install, showMessage: showMsg };
})();
</script>
<!-- IMHERE-XR:END -->
<script src="../shared/imhere-card.js"></script>
<script src="../shared/imhere-topbar.js"></script>
</head>
<body>
<div id="view"></div>
<div id="welcome" aria-live="polite"><div class="a">Welcome aboard <b>XR Aurora</b></div><div class="b">OMNI-CLASS · IH-0000</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="dock"><button id="prevBtn" type="button" aria-label="Previous stop">‹</button><button id="nextBtn" type="button">Next stop ›</button><button id="vrBtn" type="button" hidden>Enter VR</button></div>
<div id="note"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { createGoogleScenery } from '../737/google-scenery.js';
import { Aurora, POVS } from '../shared/aurora/aurora.js';
import { createBackdrop } from '../shared/aurora/backdrop.js';
import { createYosemiteWorld, AXIS, DOMES, toLocal as yToLocal } from './yosemite-world.js';
import { worldFromTour } from './tour-world.js';

const GOOGLE_KEY = 'AIzaSyD5_qsBFe74zBURZ8UTYFzz_7es3dPSM9A';   // domain-restricted to the GitHub Pages site
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);

// ---------------------------------------------------------------- renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local-floor');
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 120000);
scene.add(camera);
const fitCamera = () => { camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 84 : 62; camera.updateProjectionMatrix(); };   // phones in portrait see more of the room
fitCamera();
addEventListener('resize', () => { fitCamera(); renderer.setSize(innerWidth, innerHeight); });

// ---------------------------------------------------------------- the world: travel/yosemite/tour.js when it offers the WORLD interface, else ours
async function loadWorld() {
  try {
    const m = await import('../travel/yosemite/tour.js');
    const w = m.world || m.default || (m.createWorld && m.createWorld()) || worldFromTour(m, { name: 'Yosemite' });
    if (w && Array.isArray(w.stops) && w.stops.length && typeof w.update === 'function' && w.origin) return { w, from: 'travel/yosemite/tour.js' };
  } catch (e) { /* not on the site (yet): use the demo world */ }
  return { w: createYosemiteWorld(), from: 'aurora/yosemite-world.js' };
}
const { w: world, from: worldFrom } = await loadWorld();
const toLocal = world.toLocal || yToLocal;

// ---------------------------------------------------------------- fallback outside (sky always; valley until real scenery is near)
const s0 = toLocal(world.stops[0].lat, world.stops[0].lon, 1200);
const clear = world.stops.map((s) => { const p = toLocal(s.lat, s.lon, s.alt); return [p[0], p[2], p[1] - 140, 700]; });
const backdrop = createBackdrop({ axis: AXIS, domes: DOMES, clear, floorY: 1188, rimY: 2240, centre: [s0[0], s0[2]] });
scene.add(backdrop.group);

// ---------------------------------------------------------------- I'M HERE card + top bar (shared)
const STOPNAME = () => world.stops[world.index || 0].name;
const CRAFT_ICON = { d: 'M2 12c3-3 9-4 15-4 3 0 5 1 5 4s-2 4-5 4c-6 0-12-1-15-4zm6-1h7', w: 24, h: 24 };
let povLabel = 'Observation deck', tilesOn = false, credits = '';
function cardData() {
  const s = world.stops[world.index || 0];
  return { thumb: { icon: CRAFT_ICON, label: 'XR Aurora' }, type: 'Aurora-class craft', reg: 'IH-0000', loc: s.loc || 'Yosemite Valley, CA', org: "I'M HERE",
    id: { label: 'CRAFT', value: 'XR Aurora' }, rte: world.name + ' · ' + s.name, route: '→ ' + s.name, pov: povLabel,
    sig: { source: tilesOn ? 'Google 3D' : 'Rendered valley', tag: 'RENDERED CRAFT' }, time: Date.now(),
    details: { rows: [['Craft', 'XR Aurora (Aurora-class lead ship)'], ['REG', 'IH-0000'], ['World', world.name + ' (' + worldFrom + ')'], ['Scenery', tilesOn ? 'Google Photorealistic 3D Tiles' : 'Rendered stand-in valley']],
      notes: ['The craft and its interior are rendered. Outside: Google Photorealistic 3D Tiles where they load; a rendered valley until then.', ...Aurora.credits] } };
}
ImHereCard.init({ zIndex: 1500, ...cardData() });
const stopList = document.createElement('div'); stopList.className = 'side-list';
const about = document.createElement('div'); about.className = 'side-about';
about.textContent = 'XR Aurora, Aurora-class lead ship (IH-0000). Lower level: the Observation Lounge and the globe table. Up the steps: the Helm and the Temporal Drive. Drag to look around; tap the ring menu or the steps. ' + Aurora.credits.join(' · ') + '.';
function renderStops() {
  stopList.textContent = '';
  world.stops.forEach((s, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = s.name; if (i === (world.index || 0)) b.setAttribute('aria-current', 'true');
    b.onclick = () => goStop(i); stopList.appendChild(b); });
}
renderStops();
ImHereTopbar.init({
  zIndex: 1600, storageKey: 'imhere.aurora',
  sections: [{ id: 'stops', title: world.name, el: stopList, open: true }, { id: 'about', title: 'XR Aurora', el: about, open: false }],
  model: () => ({
    live: false, tag: true,
    data: [['LOC', STOPNAME()], ['CRAFT', 'XR Aurora'], ['REG', 'IH-0000'], ['POV', povLabel]],
    pov: POVS.map(([id, l]) => ['pov:' + id, l, '', id === Aurora.pov ? 'sel' : '']),
    layers: [['lay:planes', 'Planes', 'soon', 'dis'], ['lay:ships', 'Ships', 'soon', 'dis'], ['lay:wildlife', 'Wildlife', 'soon', 'dis'], ['lay:iss', 'ISS', 'soon', 'dis']],
    sideTitle: world.name, sideItems: world.stops.map((s, i) => ['stop:' + i, s.name, i === (world.index || 0) ? 'here' : '', i === (world.index || 0) ? 'sel' : '']),
    credit: tilesOn ? { text: credits ? 'Google · ' + credits : 'Google', short: 'Google' } : null,
  }),
  onAction: (id) => {
    if (id.startsWith('pov:')) Aurora.setPOV(id.slice(4));
    else if (id.startsWith('stop:')) goStop(+id.slice(5));
  },
});
const TBX = ImHereTopbar.xr(THREE, { cardWidth: 0.3 });

// ---------------------------------------------------------------- toast + welcome
let toastT = 0;
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3000); }
let welcomeArmed = false;   // the welcome fades 5 s after the first frame (building the craft can take a moment)

// ---------------------------------------------------------------- the craft
Aurora.mount({ scene, camera, renderer, topbarXR: TBX, onToast: toast,
  onPOV: (id, label) => { povLabel = label; ImHereCard.update({ pov: label }); ImHereTopbar.update(); },
  destinations: [{ id: 'yosemite', text: 'Yosemite Valley, CA', sub: "You're here", sel: true }, { id: 'glacier-bay', text: 'Glacier Bay, AK', sub: 'Coming soon', dis: true }],
});
Aurora.loadWorld(world);
const startPov = Q.get('pov'); if (startPov) Aurora.setPOV(startPov, { instant: true });
function goStop(i) { if (world.go) world.go(i); else if (i > (world.index || 0)) world.next(); else world.prev(); renderStops(); ImHereCard.update(cardData()); ImHereTopbar.update(); fetchWeather(); }
$('nextBtn').onclick = () => goStop((world.index || 0) + 1);
$('prevBtn').onclick = () => goStop((world.index || 0) - 1);
addEventListener('keydown', (e) => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = +e.key; if (k >= 1 && k <= POVS.length) Aurora.setPOV(POVS[k - 1][0]);
  if (e.key === 'n') goStop((world.index || 0) + 1); if (e.key === 'p') goStop((world.index || 0) - 1);
});

// ---------------------------------------------------------------- weather on the helm screen (Open-Meteo, no key; skipped when offline)
const WMO = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Fog', 51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle', 61: 'Rain', 63: 'Rain', 65: 'Heavy rain', 71: 'Snow', 73: 'Snow', 75: 'Heavy snow', 80: 'Showers', 81: 'Showers', 82: 'Showers', 95: 'Thunderstorm' };
async function fetchWeather() {
  const s = world.stops[world.index || 0];
  try {
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 8000);
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`, { signal: ac.signal });
    clearTimeout(to); if (!r.ok) return; const j = await r.json(), c = j.current || {};
    Aurora.setScreens({ wx: (WMO[c.weather_code] || 'Code ' + c.weather_code) + ' · Open-Meteo', temp: Math.round(c.temperature_2m) + '°F' });
  } catch (e) { /* offline or blocked: the screen keeps "—" */ }
}
if (/github\.io$/i.test(location.hostname)) fetchWeather();

// ---------------------------------------------------------------- Google Photorealistic 3D Tiles (same approach as 737/index.html)
let scenery = null, sceneryT = 0, creditClock = 0;
function sceneryFail(why) {
  console.warn('Real scenery unavailable:', String((why && why.message) || why || '').replace(/[?&]key=[^&\s]+/g, ''));
  if (scenery) { scenery.dispose(); scenery = null; }
  tilesOn = false; backdrop.setTerrain(true); $('note').textContent = 'Outside: rendered valley (Google 3D scenery did not load).'; ImHereTopbar.update(); ImHereCard.update(cardData());
}
async function startScenery() {
  if (!GOOGLE_KEY) { sceneryFail('no Google key'); return; }
  $('note').textContent = 'Loading Google 3D scenery…';
  try {
    const sc = await createGoogleScenery({ THREE, GLTFLoader, DRACOLoader, renderer, camera, key: GOOGLE_KEY, onStatus: (t) => { $('note').textContent = t; } });
    scenery = sc; scene.add(scenery.holder);
    scenery.setOrigin(world.origin.lat, world.origin.lon, 0);   // the world frame: ellipsoid height 0 at the origin
  } catch (e) { sceneryFail(e); }
}
function sceneryStep(dt) {
  if (!scenery) return;
  try { scenery.update(dt); } catch (e) { sceneryFail(e); return; }
  const st = scenery.stats(); sceneryT += dt;
  if (!st.visible && (sceneryT > 25 || (st.failed >= 3 && !st.loaded && sceneryT > 6))) { sceneryFail(st.lastError || 'no tiles showed after 25 s'); return; }
  const near = st.near > 0 || st.visible > 30;
  if (near !== tilesOn) { tilesOn = near; backdrop.setTerrain(!near); ImHereTopbar.update(); ImHereCard.update(cardData()); $('note').textContent = near ? '' : 'Streaming Google 3D scenery…'; }
  if ((creditClock += dt) > 2) { creditClock = 0; const c = scenery.credits(); if (c !== credits) { credits = c; ImHereTopbar.update(); } }
}
startScenery();

// ---------------------------------------------------------------- VR (shared xr-safety: Exit VR on the card, B / Y, watchdog, 0.9 scale, foveation)
const XRS = window.ImHereXR ? window.ImHereXR.install({ THREE, renderer, scene, camera, scale: 0.9, rays: true, panel: false, exitButtons: [5],
  exitTargets: TBX.card ? [TBX.card] : [], hint: 'Point + select · B or Y: exit VR',
  onQuality: (n) => { Aurora.setQuality(n); if (scenery && scenery.tiles) scenery.tiles.errorTarget = [12, 24, 48][n] || 48; } }) : null;
if (TBX.card) { TBX.card.userData.onExitHover = (on) => ImHereCard.xrExitHover(on); }
async function setupVR() {
  if (!navigator.xr || !navigator.xr.isSessionSupported) return;
  let ok = false; try { ok = await navigator.xr.isSessionSupported('immersive-vr'); } catch (e) { ok = false; }
  if (!ok) return;
  $('vrBtn').hidden = false;
  $('vrBtn').onclick = async () => {
    if (renderer.xr.isPresenting) return;
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'hand-tracking'] });
      await renderer.xr.setSession(s);
    } catch (e) { toast('VR could not start: ' + (e && e.message || e)); }
  };
}
renderer.xr.addEventListener('sessionstart', () => { ImHereTopbar.setXR(true); ImHereTopbar.setCard(true); $('vrBtn').hidden = true; setTimeout(() => Aurora.toast('Welcome aboard XR Aurora'), 600); });
renderer.xr.addEventListener('sessionend', () => { ImHereTopbar.setXR(false); $('vrBtn').hidden = false; });
setupVR();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let cardClock = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.1, clock.getDelta());
  Aurora.update(dt);
  sceneryStep(dt);
  backdrop.update(camera);
  if ((cardClock += dt) > 1) { cardClock = 0; ImHereCard.update({ time: Date.now() }); }
  renderer.render(scene, camera);
  if (!welcomeArmed) { welcomeArmed = true; setTimeout(() => { $('welcome').style.opacity = '0'; }, 5000); }
});

window.__aurora = { Aurora, renderer, scene, camera, world, TBX, backdrop, XRS, scenery: () => scenery, info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }) };
</script>
</body>
