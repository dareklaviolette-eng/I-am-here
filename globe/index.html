<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>I'M HERE · Be there</title>
<style>
  :root { --bg: rgba(10,18,32,.86); --line: rgba(255,255,255,.14); --ink: #e8eef7; --dim: #9fb0c0; --gold: #ffc24a; --green: #5DCAA5; --ship: #4fd1e8; --wild: #ff8a3d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1424; color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #map:active { cursor: grabbing; }
  button, input, a { font: inherit; color: inherit; }
  #panel { position: fixed; left: 10px; top: calc(10px + var(--imh-h, 0px)); width: 310px; max-height: calc(100% - 20px - var(--imh-h, 0px)); overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; backdrop-filter: blur(6px); z-index: 10; }
  #searchWrap { position: relative; }
  #q { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); font-size: 16px; outline: none; }
  #q:focus { border-color: var(--green); }
  #q::placeholder { color: #b8c4d2; }
  #sugg { list-style: none; margin: 6px 0 0; padding: 0; }
  #sugg li button { display: block; width: 100%; text-align: left; padding: 9px 10px; margin: 2px 0; border: 0; border-radius: 8px; background: rgba(255,255,255,.06); cursor: pointer; }
  #sugg li button:hover, #sugg li button:focus { background: rgba(255,255,255,.14); }
  #sugg small { display: block; color: var(--dim); font-size: 12px; }
  #searchNote { min-height: 0; font-size: 12px; color: var(--dim); margin-top: 6px; }
  #searchNote:empty { display: none; }
  h2 { font-size: 11px; letter-spacing: .18em; font-weight: 600; color: var(--dim); margin: 16px 0 6px; text-transform: uppercase; }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .layer { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.04); cursor: pointer; text-align: left; min-height: 44px; }
  .layer i { width: 10px; height: 10px; border-radius: 50%; background: #445; flex: none; }
  .layer.on { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.12); }
  .layer.on i { background: var(--c, var(--green)); box-shadow: 0 0 8px var(--c, var(--green)); }
  .layer[disabled] { opacity: .45; cursor: not-allowed; }
  .layer small { display: block; font-size: 11px; color: var(--dim); }
  .layer span { flex: 1; }
  .layer b { font-weight: 500; }
  #status { font-size: 12px; color: var(--dim); margin-top: 8px; }
  #status div { margin: 2px 0; }
  .shelf a { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; margin: 5px 0; border-radius: 9px; background: rgba(255,255,255,.06); text-decoration: none; min-height: 44px; }
  .shelf a small { color: var(--dim); font-size: 12px; }
  #panelToggle { display: none; }
  /* the card sits above the item it belongs to (placed by app.js) and always inside the screen */
  #card { position: fixed; left: 0; top: 0; width: min(310px, calc(100vw - 16px)); max-height: calc(100% - 16px); overflow: auto; overscroll-behavior: contain;
    background: rgba(10,18,32,.93); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; z-index: 11; backdrop-filter: blur(6px);
    box-shadow: 0 6px 24px rgba(0,0,0,.45); will-change: transform; }
  #card[hidden] { display: none; }
  #card .route { font-size: 18px; font-weight: 600; margin-top: 3px; letter-spacing: .02em; }
  #card .route small { font-size: 12px; font-weight: 400; color: var(--dim); letter-spacing: 0; margin-left: 4px; }
  #card .route .dim, #card .dim { font-size: 13px; font-weight: 400; color: var(--dim); }
  #card .ph { display: flex; align-items: center; justify-content: center; margin: 10px 0 0; height: 96px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.05); }
  #card .ph img { display: block; max-width: 100%; max-height: 96px; width: auto; height: auto; object-fit: contain; }
  #card .ph.wait { font-size: 12px; color: var(--dim); }
  #card .phnone { margin-top: 8px; font-size: 11.5px; color: var(--dim); }
  #card .credit { font-size: 11px; color: var(--dim); margin-top: 3px; }
  #card .credit a { color: #cfe0f2; }
  #card .credit b { color: var(--ink); font-weight: 600; }
  #card .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; font-size: 22px; color: var(--dim); cursor: pointer; padding: 6px 10px; }
  #card .kind { font-size: 11px; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
  #card .title { font-size: 21px; font-weight: 600; margin: 2px 0 0; padding-right: 30px; line-height: 1.2; }
  #card .sub { color: var(--dim); font-size: 12.5px; }
  #card dl { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; margin: 8px 0 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
  #card dl.one { grid-template-columns: auto 1fr; }
  #card dt { color: var(--dim); }
  #card dd { margin: 0; }
  #card .age { font-size: 13px; color: var(--dim); }
  #card .age .live { color: var(--green); font-weight: 600; }
  #card .note { font-size: 12.5px; color: #d5dde7; background: rgba(255,194,74,.12); border-left: 3px solid var(--gold); padding: 6px 8px; border-radius: 4px; margin: 8px 0 0; }
  #card .go { display: block; text-align: center; margin-top: 10px; padding: 12px; font-size: 19px; font-weight: 700; letter-spacing: .02em; border-radius: 12px; background: #2f9e78; color: #fff; text-decoration: none; }
  #card .go:hover { background: #36b388; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: rgba(255,194,74,.2); color: var(--gold); margin-left: 6px; vertical-align: middle; }
  #hint { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 9; padding: 12px 18px; border-radius: 24px; border: 1px solid rgba(79,209,232,.6);
    background: rgba(10,18,32,.88); color: var(--ink); text-decoration: none; font-size: 15px; }
  #hint[hidden] { display: none; }
  #sig { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 12; max-width: min(520px, calc(100% - 140px)); padding: 7px 14px; border-radius: 16px;
    background: rgba(10,18,32,.92); border: 1px solid rgba(255,156,122,.65); color: #ffe1d6; font-size: 13px; text-align: center; pointer-events: none; font-variant-numeric: tabular-nums; }
  #sig.back { border-color: rgba(93,202,165,.7); color: #d4f5e8; }
  #sig[hidden] { display: none; }
  #zoom { position: fixed; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 9; }
  #zoom button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 22px; cursor: pointer; }
  #credits { position: fixed; right: 0; bottom: 0; z-index: 9; font-size: 11px; color: #cfd8e3; background: rgba(10,18,32,.7); padding: 3px 8px; border-top-left-radius: 6px; max-width: 100%; }
  #credits a { color: #cfd8e3; }
  @media (max-width: 720px) {
    #panel { left: 8px; right: 8px; width: auto; padding: 10px; max-height: calc(100% - 16px - var(--imh-h, 0px)); }
    #panel .more { display: none; }
    #panel.open .more { display: block; }
    #panelToggle { display: block; width: 100%; margin-top: 8px; padding: 9px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; }
    #sig { top: auto; bottom: 30px; max-width: calc(100% - 16px); font-size: 12px; }
    #hint { bottom: 70px; }
    #zoom { top: auto; bottom: 120px; }
    #credits { font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="map" aria-label="Map of live flights, ships, the space station and animal tracks"></canvas>

<aside id="panel">
  <div id="searchWrap">
    <input id="q" type="search" placeholder="Where do you want to be?" aria-label="Where do you want to be? Flight number, callsign, tail, ship, animal or place" spellcheck="false" autocomplete="off" enterkeyhint="go">
    <ul id="sugg"></ul>
    <div id="searchNote"></div>
  </div>
  <button id="panelToggle" aria-expanded="false">Layers &amp; more</button>
  <div class="more">
    <h2>Layers</h2>
    <div class="layers">
      <button class="layer" data-layer="flights" style="--c:#fff"><i></i><span><b>Flights</b><small id="nFlights">live</small></span></button>
      <button class="layer" data-layer="ships" style="--c:var(--ship)"><i></i><span><b>Ships</b><small id="nShips">live</small></span></button>
      <button class="layer" data-layer="space" style="--c:#fff"><i></i><span><b>Space</b><small id="nSpace">ISS</small></span></button>
      <button class="layer" data-layer="wildlife" style="--c:var(--wild)"><i></i><span><b>Wildlife</b><small>sample tracks</small></span></button>
      <button class="layer" data-layer="cameras" disabled title="Live webcams need a server-side key first"><i></i><span><b>Cameras</b><small>coming soon</small></span></button>
      <button class="layer" disabled title="Coming"><i></i><span><b>My people</b><small>coming</small></span></button>
      <button class="layer" disabled title="Coming"><i></i><span><b>Sports</b><small>coming</small></span></button>
    </div>
    <div id="status"><div id="stFlights"></div><div id="stShips"></div><div id="stSpace"></div></div>
    <h2>More experiences</h2>
    <div class="shelf">
      <a href="../heart/">Heart <small>Tour through the heart</small></a>
      <a href="../737/">737 cockpit <small>Demo approach, Nashville</small></a>
      <a href="../home.html">All prototypes <small>Home</small></a>
    </div>
  </div>
</aside>

<div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
<a id="hint" hidden href="../boats/">Live ships aren't on this map yet: open live ships</a>
<section id="card" hidden aria-live="polite"></section>
<div id="sig" hidden role="status" aria-live="polite"></div>
<div id="credits">Imagery &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>, Maxar, Earthstar Geographics, and the GIS User Community · Labels &copy; Esri · <span id="dataCredit"></span></div>

<script id="imhere-mark">
/* I'M HERE experience label, v4 (founder-approved final design). SOURCE OF TRUTH: /home/claude/shared/imhere-mark.js
   Pasted inline into every prototype page between the IMHERE-MARK markers by
   node /home/claude/shared/sync-mark.mjs <files...>  (artifact pages cannot share files).
   Edit here, then re-run the sync. Self-contained: no network, no dependencies.

   Layout (top-left on screens; panel rgba(10,18,32,.55), 1px border white 18%, 8px radius):
       I'M HERE                                   (i)  ×     <- watermark: 9-11px, .25em spacing, white 30%
       SWA 444 · 737-800 · approach BNA                      <- context line: 11px, white 60%, no headline
       LOC:      Nashville, TN                               <- labels: outlined caps (transparent fill, 0.5px stroke,
       SIGNAL:   airplanes.live, live                           white 65%, 11px); values: solid white 13px, one column
       VIEW:     Google 3D + render
   Only the word "live" is coloured (green #5DCAA5), and only while setLive(true): pages drive it from real data freshness;
   demo/simulated data never sets it. After ~6 s the label collapses to a small "I'M HERE" corner mark; tap to re-expand.
   (i) opens the details: live stats + provenance (source, last update, live vs recorded/simulated, render vs real imagery).
   In VR, xrPanel(THREE) draws the same label on a canvas (row labels use a 50% white fill there: hairline outlines
   alias and shimmer at headset panel scale).

   Optional two-line identity (v4.1; pages that pass only `context` look exactly as before):
       I'M HERE                                   (i)  ×
       Health · Cardiovascular system                        <- line1: provider · type (11px, white 60%)
       Entering the heart from your upper body               <- line2: where you are, plain English (13px, white 92%)
       superior vena cava                                    <- line2small: the technical term (10px, white 45%)
       LOC / SIGNAL / VIEW rows as above

   API
     ImHereMark.init({ context, line1, line2, line2small, about, loc, signal, view, stats, tag, sceneNote, items, credits, below, zIndex })
     ImHereMark.update({ ...same keys })
        context   e.g. 'SWA 444 · 737-800 · approach BNA', 'ISS · over Pacific Ocean', 'Heart · stop 1 of 10'
        line1     optional identity line 1 (provider · type); replaces `context` when given
        line2     optional identity line 2: where you are, in plain English
        line2small optional smaller, dimmer line under line2 (e.g. the medical or technical term)
        about     optional { title, text } shown at the top of the (i) details (e.g. the current stop, in plain words)
        loc       place, e.g. 'Nashville, TN'
        signal    { source, time }  -> "source, live" while setLive(true), else "source, 3 hrs ago"
                  { source, date }  -> "GPS track, 3 May 2008"      { text } -> 'Demo data', 'Fixed camera', ...
        view      what you are seeing: 'Google 3D + render', '3D render', 'Live video', 'Video, Nov 9'
        stats     [[label, value], ...] shown in the (i) details
        tag       { text } status line for the details ("Now: ...")
        sceneNote sentence in the details: AI-created/rendered vs actual imagery
        items     provenance list: { kind, label, source, age, time, timeLabel, note, href, list: [{ text, time | age }] }
                  kind live | recorded | data | computed | estimated | assumed | simulated | sample | illustrative | ai
        below     CSS selector(s): the label sits just under the lowest visible one (e.g. the page header)
     ImHereMark.setLive(true|false)   "live" (green) in SIGNAL. Only while the data is really fresh.
     ImHereMark.xrPanel(THREE, { width, x, y, z })  -> small THREE.Mesh panel, kept up to date
     ImHereMark.open() / close() / dismiss() / expand() / isLive() / label() / items()
   CSS variable --imh-h on <html>: height taken by the label (or the corner mark) + gap, so a page can push its
   own top-left panel down: top: calc(60px + var(--imh-h, 0px)).
*/

  'use strict';
  if (window.ImHereMark) return;
  var KINDS = {

  var box, mini, miniLive, r2, id2, id3, rowsEl, more, src, lastSig = '', lastSrcSig = '', xr = null, collapseAt = 0, hovering = false;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmtAge(ms) {   // "3 s ago", "14 min ago", "3 hrs ago", "5 days ago", "7 yrs ago"
    if (!(ms >= 0)) return ms < 0 ? 'just now' : '';
    var s = Math.round(ms / 1000), n;

    if (s < 90) return s + ' s ago';
