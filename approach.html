<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I'M HERE Approach</title>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.170.0",
    "three/": "https://esm.sh/three@0.170.0/",
    "3d-tiles-renderer": "https://esm.sh/3d-tiles-renderer@0.4?external=three",
    "3d-tiles-renderer/plugins": "https://esm.sh/3d-tiles-renderer@0.4/plugins?external=three"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #note { position: fixed; inset: auto 0 96px 0; text-align: center; padding: 0 20px; font-size: 18px; line-height: 1.4; }
  #credit { position: fixed; left: 10px; bottom: 8px; font-size: 13px; opacity: .85; }
  a { color: #8ab4ff; }
</style>
</head>
<body>
<div id="note">Loading...</div>
<div id="credit">Map data: Google</div>
<script type="module">
const STORE = "imhere.googleKey";
const note = document.getElementById("note");
function say(html) { note.innerHTML = html; }
function dms(d, m, s) { return d + m / 60 + s / 3600; }

// FAA final approach segment data for BNA RNAV (GPS) Y RWY 20R.
const THRESHOLD = { lat: dms(36, 8, 16.2320), lon: -dms(86, 40, 42.8335), height: 140.1 };
const COURSE_POINT = { lat: dms(36, 6, 51.2060), lon: -dms(86, 41, 16.1835) };
const CROSSING_HEIGHT = 60.4 * 0.3048;
const GLIDE_TAN = Math.tan(3 * Math.PI / 180);
const RUNWAY_RISE_PER_METER = (598.7 - 555.6) * 0.3048 / 2348;

const START_DISTANCE = 6 * 1852;   // meters before the threshold
const APPROACH_SPEED = 72;         // meters per second, about 140 knots
const BRAKING = 2;                 // meters per second squared
const EYE_HEIGHT = 5;              // meters above the runway at rollout
const TOUCHDOWN_PAST_THRESHOLD = 300;

const M_PER_DEG_LAT = 110950;
const M_PER_DEG_LON = 111320 * Math.cos(THRESHOLD.lat * Math.PI / 180);
const eastM = (COURSE_POINT.lon - THRESHOLD.lon) * M_PER_DEG_LON;
const northM = (COURSE_POINT.lat - THRESHOLD.lat) * M_PER_DEG_LAT;
const courseLength = Math.hypot(eastM, northM);
const unitEast = eastM / courseLength, unitNorth = northM / courseLength;
const HEADING = Math.atan2(unitEast, unitNorth);

// FAA runway end positions and elevations in feet.
const UNDULATION = 140.1 - 555.6 * 0.3048;
const RUNWAYS = [
  { a: [36, 6, 11.9899, 86, 41, 16.6591, 569.1], b: [36, 7, 27.2406, 86, 40, 46.5500, 571.8] },
  { a: [36, 7, 3.6342, 86, 41, 11.3105, 598.7], b: [36, 8, 16.2324, 86, 40, 42.8335, 555.6], approachEnd: true },
  { a: [36, 6, 45.7670, 86, 40, 3.5138, 589.8], b: [36, 8, 1.0116, 86, 39, 33.3955, 540.0] },
  { a: [36, 8, 28.5991, 86, 41, 43.2788, 535.9], b: [36, 7, 13.7852, 86, 40, 5.4384, 582.3] }
];
const RUNWAY_HALF_WIDTH = 150 * 0.3048 / 2;

function runwayEnd(e) {
  const lat = dms(e[0], e[1], e[2]), lon = -dms(e[3], e[4], e[5]);
  return {
    x: (lon - THRESHOLD.lon) * M_PER_DEG_LON,
    y: e[6] * 0.3048 + UNDULATION - THRESHOLD.height + 2,
    z: -(lat - THRESHOLD.lat) * M_PER_DEG_LAT
  };
}

function buildRunwayMarks(THREE) {
  const quad = [], white = [], green = [];
  for (const runway of RUNWAYS) {
    const a = runwayEnd(runway.a), b = runwayEnd(runway.b);
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const length = Math.hypot(dx, dz);
    const sideX = -dz / length * RUNWAY_HALF_WIDTH, sideZ = dx / length * RUNWAY_HALF_WIDTH;
    quad.push(
      a.x + sideX, a.y, a.z + sideZ, a.x - sideX, a.y, a.z - sideZ, b.x + sideX, b.y, b.z + sideZ,
      b.x + sideX, b.y, b.z + sideZ, a.x - sideX, a.y, a.z - sideZ, b.x - sideX, b.y, b.z - sideZ
    );
    const count = Math.round(length / 60);
    for (let i = 0; i <= count; i++) {
      const t = i / count;
      for (const side of [1, -1]) {
        white.push(a.x + dx * t + sideX * side, a.y + dy * t, a.z + dz * t + sideZ * side);
      }
    }
    if (runway.approachEnd) {
      const ux = dx / length, uz = dz / length;
      for (let i = -3; i <= 3; i++) {
        green.push(b.x + sideX * i / 3, b.y, b.z + sideZ * i / 3);
      }
      for (let d = 60; d <= 420; d += 60) {
        for (let i = -1; i <= 1; i++) {
          white.push(b.x + ux * d + sideX * i * 0.4, b.y, b.z + uz * d + sideZ * i * 0.4);
        }
      }
    }
  }
  const group = new THREE.Group();
  group.matrixAutoUpdate = false;
  const surface = new THREE.MeshBasicMaterial({
    color: 0x3f4347, side: THREE.DoubleSide, transparent: true, depthTest: false, depthWrite: false
  });
  const surfaceGeometry = new THREE.BufferGeometry();
  surfaceGeometry.setAttribute("position", new THREE.Float32BufferAttribute(quad, 3));
  const mesh = new THREE.Mesh(surfaceGeometry, surface);
  mesh.frustumCulled = false;
  mesh.renderOrder = 10;
  group.add(mesh);
  const materials = [surface];
  for (const [points, color] of [[white, 0xffffff], [green, 0x33ff66]]) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(points, 3));
    const material = new THREE.PointsMaterial({
      color: color, size: 5, sizeAttenuation: false, transparent: true, depthTest: false, depthWrite: false
    });
    const lights = new THREE.Points(geometry, material);
    lights.frustumCulled = false;
    lights.renderOrder = 11;
    group.add(lights);
    materials.push(material);
  }
  return { group: group, materials: materials };
}

function readKey() { try { return localStorage.getItem(STORE) || ""; } catch (e) { return ""; } }

// along is meters past the threshold; negative is still on approach.
function positionAt(along) {
  const ground = THRESHOLD.height + Math.max(0, along) * RUNWAY_RISE_PER_METER + EYE_HEIGHT;
  const aimDistance = TOUCHDOWN_PAST_THRESHOLD - along;
  const glide = THRESHOLD.height + EYE_HEIGHT + aimDistance * GLIDE_TAN;
  const gap = glide - ground;
  const softness = 15;
  let above = gap;
  if (gap <= -softness) { above = 0; }
  else if (gap < softness) { above = (gap + softness) * (gap + softness) / (4 * softness); }
  return {
    lat: THRESHOLD.lat + along * unitNorth / M_PER_DEG_LAT,
    lon: THRESHOLD.lon + along * unitEast / M_PER_DEG_LON,
    height: ground + above
  };
}

function earthPoint(THREE, place, target) {
  const a = 6378137, e2 = 6.69437999014e-3;
  const lat = THREE.MathUtils.degToRad(place.lat);
  const lon = THREE.MathUtils.degToRad(place.lon);
  const sLat = Math.sin(lat), cLat = Math.cos(lat), sLon = Math.sin(lon), cLon = Math.cos(lon);
  const N = a / Math.sqrt(1 - e2 * sLat * sLat);
  return target.set(
    (N + place.height) * cLat * cLon,
    (N + place.height) * cLat * sLon,
    (N * (1 - e2) + place.height) * sLat
  );
}

function setLocalFrame(THREE, matrix, place) {
  const a = 6378137, e2 = 6.69437999014e-3;
  const lat = THREE.MathUtils.degToRad(place.lat);
  const lon = THREE.MathUtils.degToRad(place.lon);
  const sLat = Math.sin(lat), cLat = Math.cos(lat), sLon = Math.sin(lon), cLon = Math.cos(lon);
  const N = a / Math.sqrt(1 - e2 * sLat * sLat);
  const px = (N + place.height) * cLat * cLon;
  const py = (N + place.height) * cLat * sLon;
  const pz = (N * (1 - e2) + place.height) * sLat;
  const ex = -sLon, ey = cLon, ez = 0;
  const ux = cLat * cLon, uy = cLat * sLon, uz = sLat;
  const sx = sLat * cLon, sy = sLat * sLon, sz = -cLat;
  matrix.set(
    ex, ey, ez, -(ex * px + ey * py + ez * pz),
    ux, uy, uz, -(ux * px + uy * py + uz * pz),
    sx, sy, sz, -(sx * px + sy * py + sz * pz),
    0, 0, 0, 1
  );
}

async function main() {
  const key = readKey();
  if (!key) {
    say('Enter your key once on the <a href="./">main page</a>, then come back.');
    return;
  }
  const THREE = await import("three");
  const { VRButton } = await import("three/examples/jsm/webxr/VRButton.js");
  const { DRACOLoader } = await import("three/examples/jsm/loaders/DRACOLoader.js");
  const { TilesRenderer } = await import("3d-tiles-renderer");
  const { GoogleCloudAuthPlugin, GLTFExtensionsPlugin } = await import("3d-tiles-renderer/plugins");

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9cc4e8);
  scene.add(new THREE.AmbientLight(0xffffff, 3));

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 300000);
  camera.rotation.x = -0.06;
  const rig = new THREE.Group();
  rig.add(camera);
  rig.rotation.y = -HEADING;
  scene.add(rig);

  const tiles = new TilesRenderer("https://tile.googleapis.com/v1/3dtiles/root.json");
  tiles.registerPlugin(new GoogleCloudAuthPlugin({ apiToken: key, autoRefreshToken: true }));
  const draco = new DRACOLoader().setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
  tiles.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader: draco }));
  tiles.errorTarget = 12;
  if (tiles.downloadQueue) { tiles.downloadQueue.maxJobs = 30; }
  if (tiles.parseQueue) { tiles.parseQueue.maxJobs = 6; }
  tiles.group.matrixAutoUpdate = false;
  tiles.addEventListener("load-error", function (event) {
    say("A map piece failed to load: " + ((event.error && event.error.message) || "unknown error"));
  });
  scene.add(tiles.group);

  const ROUTE_POINTS = [-6000, -3000, -1200, -400, 100, 700];
  const AHEAD_POINTS = [800, 1600, 2500, 3500, 5000, 7000];
  const LAST_SCOUT_POINT = 1800;
  const MIN_WAIT = 5000, MAX_WAIT = 45000;
  const scouts = ROUTE_POINTS.map(function () {
    const scout = new THREE.PerspectiveCamera(90, 1, 1, 300000);
    scout.rotation.order = "YXZ";
    scout.rotation.y = -HEADING;
    scout.rotation.x = -0.05;
    tiles.setCamera(scout);
    tiles.setResolution(scout, 2000, 2000);
    return scout;
  });
  const scratch = new THREE.Vector3();
  function moveScouts() {
    scouts.forEach(function (scout, i) {
      const point = state === "flying"
        ? Math.min(LAST_SCOUT_POINT, along + AHEAD_POINTS[i])
        : ROUTE_POINTS[i];
      earthPoint(THREE, positionAt(point), scratch).applyMatrix4(tiles.group.matrix);
      scout.position.copy(scratch);
      scout.updateMatrixWorld(true);
    });
  }

  let along = -START_DISTANCE;
  let speed = 0;
  let waitStarted = 0;
  const SPEEDS = [1, 2, 4, 8];
  let speedIndex = 0;
  const buttonsDown = {};

  // On Quest controllers button 4 is X or A, and button 5 is Y or B.
  function readSpeedButtons() {
    const session = renderer.xr.getSession();
    if (!session) { return; }
    for (const source of session.inputSources) {
      if (!source.gamepad) { continue; }
      [[4, -1], [5, 1]].forEach(function (pair) {
        const button = source.gamepad.buttons[pair[0]];
        const id = source.handedness + pair[0];
        const pressed = !!(button && button.pressed);
        if (pressed && !buttonsDown[id]) {
          speedIndex = Math.min(SPEEDS.length - 1, Math.max(0, speedIndex + pair[1]));
        }
        buttonsDown[id] = pressed;
      });
    }
  }
  let state = "ready";

  // The drawn runways fade out on short final, leaving Google's real imagery.
  const marks = buildRunwayMarks(THREE);
  scene.add(marks.group);
  const toLocal = new THREE.Matrix4();
  setLocalFrame(THREE, toLocal, THRESHOLD);
  const fromLocal = toLocal.clone().invert();

  function place() {
    setLocalFrame(THREE, tiles.group.matrix, positionAt(along));
    tiles.group.matrixWorldNeedsUpdate = true;
    tiles.group.updateMatrixWorld(true);
    marks.group.matrix.multiplyMatrices(tiles.group.matrix, fromLocal);
    marks.group.matrixWorldNeedsUpdate = true;
    marks.group.updateMatrixWorld(true);
    const fade = Math.min(1, Math.max(0, (-along - 500) / 1500));
    marks.group.visible = fade > 0;
    marks.materials.forEach(function (material) { material.opacity = fade; });
  }
  place();

  function press() {
    if (state === "ready") {
      state = "waiting";
      waitStarted = performance.now();
      say("Finishing the route download...");
    } else {
      state = "ready";
      speed = 0;
      speedIndex = 0;
      along = -START_DISTANCE;
      place();
      say("Pull the trigger to start the approach.");
    }
  }

  for (const i of [0, 1]) {
    const controller = renderer.xr.getController(i);
    controller.addEventListener("selectstart", press);
    rig.add(controller);
  }
  renderer.domElement.addEventListener("click", function () {
    if (!renderer.xr.isPresenting) { press(); }
  });

  let activeCamera = camera;
  tiles.setCamera(camera);
  function useCamera(next) {
    if (next === activeCamera) { return; }
    tiles.deleteCamera(activeCamera);
    tiles.setCamera(next);
    activeCamera = next;
  }

  window.addEventListener("resize", function () {
    if (renderer.xr.isPresenting) { return; }
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  say("Press ENTER VR, then pull the trigger. The approach starts once the route has loaded.");
  let last = performance.now();
  renderer.setAnimationLoop(function (now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    readSpeedButtons();
    if (state === "waiting") {
      const waited = now - waitStarted;
      const stats = tiles.stats;
      const quiet = stats && stats.downloading === 0 && stats.parsing === 0;
      if ((quiet && waited > MIN_WAIT) || waited > MAX_WAIT) {
        state = "flying";
        speed = APPROACH_SPEED;
        say("");
      }
    }
    if (state === "flying") {
      const scaled = dt * SPEEDS[speedIndex];
      if (along >= TOUCHDOWN_PAST_THRESHOLD) { speed = Math.max(0, speed - BRAKING * scaled); }
      along += speed * scaled;
      if (speed === 0) { state = "stopped"; }
      place();
    }
    if (renderer.xr.isPresenting) {
      const xrCamera = renderer.xr.getCamera();
      useCamera(xrCamera);
      const eye = xrCamera.cameras[0];
      if (eye && eye.viewport) { tiles.setResolution(xrCamera, eye.viewport.z, eye.viewport.w); }
    } else {
      useCamera(camera);
      tiles.setResolutionFromRenderer(camera, renderer);
    }
    rig.updateMatrixWorld(true);
    moveScouts();
    tiles.update();
    renderer.render(scene, camera);
  });
}

main().catch(function (error) {
  say("Approach page failed to start: " + ((error && error.message) || error));
});
</script>
</body>
</html>
